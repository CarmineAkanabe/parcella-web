<svg xmlns="http://www.w3.org/2000/svg" width="760" height="180" viewBox="0 0 760 180" role="img" aria-labelledby="title desc">
  <title id="title">Parcella</title>
  <desc id="desc">Warm Industrial Logistics delivery brand mark: a geometric parcel in motion in terracotta and forest emerald, paired with a deep slate Parcella wordmark.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A43716"/>
      <stop offset="0.58" stop-color="#C54F2C"/>
      <stop offset="1" stop-color="#D95D39"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F242A"/>
      <stop offset="0.55" stop-color="#2C353D"/>
      <stop offset="1" stop-color="#C54F2C"/>
    </linearGradient>
  </defs>

  <!-- Parcel-in-motion mark: sturdy package in terracotta, inner fold and forward motion cue in forest emerald. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M27 61 78 34l51 27v61l-51 28-51-28Z" stroke="url(#brand)" stroke-width="9"/>
    <path d="m27 61 51 29 51-29M78 90v60" stroke="#C54F2C" stroke-width="8"/>
    <path d="m53 47 51 29" stroke="#1E684D" stroke-width="8"/>
    <path d="M129 91h27m-11-12 12 12-12 12" stroke="#1E684D" stroke-width="8"/>
    <path d="M8 83h12M13 105h7" stroke="#D95D39" stroke-width="7"/>
  </g>

  <text x="190" y="119" fill="url(#word)" font-family="'Plus Jakarta Sans', Inter, Avenir Next, Helvetica, Arial, sans-serif" font-size="82" font-weight="800" letter-spacing="-3.2">Parcella</text>
</svg>
